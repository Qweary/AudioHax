[package]
name = "audiohax"       # changed to snake case
version = "0.1.0"
edition = "2021"
# `cargo run` (no `--bin`) is ambiguous across the 8 bins; pin it to the
# image-to-music app so `cargo run -- play <img>` works without `--bin audiohax`.
default-run = "audiohax"

# ── Explicit bin tables for the IMAGE-dependent targets ──────────────────────
# These three targets import the `image`/`opencv` crates UNCONDITIONALLY, so they
# only compile under the default feature set. Declaring `required-features` lets
# `cargo build --no-default-features` (and `cargo test --no-default-features`)
# SKIP them instead of failing to compile them — which is what previously forced
# the modem integration test to be run via a manual rustc invocation. The
# modem-only bins (channel_sim, make_packetized, modem_encode, modem_decode) are
# left to autodiscovery so they still build with --no-default-features.
[[bin]]
name = "audiohax"          # src/main.rs — the image-to-music app
path = "src/main.rs"
# S59 Lane H: required-features LOWERED to the TRUE minimum after fixing the ROOT
# source defect in main.rs. S58 (below) set the full default set because main.rs's
# feature-gating was internally inconsistent — a `#[cfg(not(feature="opencv"))]`-guarded
# `pure_analysis` block (predicate keyed on the ABSENCE of opencv, not the PRESENCE of
# pure-analysis) plus an UNCONDITIONAL `midi_output::MidiOut`/`midir` reference — so the
# bin could not compile under a pure-Rust set and had to be SKIPPED wholesale. S59 makes
# the gating honest: every `pure_analysis` ref is now gated on `all(not(opencv),
# feature="pure-analysis")` (opencv-preferred, else pure), and every `MidiOut`/`midir`
# ref (the module, the imports, the `impl AudioSink for MidiOut`, the `--list-midi-ports`
# query, and the MIDI arm of runtime sink selection) is gated on `feature="midi-out"`.
# The app therefore GENUINELY compiles under `--no-default-features --features
# pure-analysis,synth` (the reduced pure-Rust headless set), so the minimum is exactly
# `["pure-analysis", "synth"]`:
#   * `synth` stays REQUIRED — it is a hard dependency of the app's event model, not an
#     optional output: `build_step_event_timeline` returns `synth_sink::TimedMidiEvent`
#     and the stream loop dispatches `synth_sink::MidiCmd` on EVERY sink (MIDI included),
#     so there is no build of this bin without `synth`.
#   * `pure-analysis` stays REQUIRED as the DEFAULT image provider (default has no
#     opencv) — it also guarantees a defined feature `source` so `--features synth`
#     alone can't compile to a missing-source error. opencv is normally ADDITIVE over
#     the default set (`cargo build --features opencv` keeps pure-analysis+synth), so
#     the opencv escape hatch still builds.
#   * `midi-out` is now TRULY OPTIONAL. It is in the DEFAULT set, so `cargo run`/`cargo
#     build` compile it and select the sink at runtime exactly as before (default
#     behavior byte-preserved); a pure-Rust build drops it and uses the synth only.
# Under `--no-default-features` (nothing on) the bin is still cleanly SKIPPED
# (pure-analysis absent), so `cargo test --no-default-features` stays green.
required-features = ["pure-analysis", "synth"]

# S123 — the first desktop window (egui/eframe). Behind the NON-default `gui` feature, so
# `cargo build`, `cargo test` and every `--no-default-features` build compile none of it.
# `gui` itself enables `pure-analysis`, `synth` and `midi-out` (the window renders, plays
# through the bundled synth, and can route to a MIDI port), so the one feature is enough.
[[bin]]
name = "audiohax-gui"
path = "src/bin/audiohax-gui.rs"
required-features = ["gui"]

[[bin]]
name = "make_tiled_payload"
path = "src/bin/make_tiled_payload.rs"
required-features = ["image"]

[[bin]]
name = "unpack_tiled_payload"
path = "src/bin/unpack_tiled_payload.rs"
required-features = ["image"]

# ── Explicit test tables for FEATURE-DEPENDENT integration tests ─────────────
# Same mechanism as the image `[[bin]]` targets above (S5). Cargo auto-discovers
# every file in tests/, so a test that imports a feature-gated item
# UNCONDITIONALLY fails to compile under `--no-default-features` (E0432). Naming
# the test with its true minimal `required-features` lets cargo SKIP it when the
# feature is off, so `cargo test --no-default-features` compiles only the
# music+modem (pure-Rust, dependency-free) tests and runs them green. A `[[test]]`
# table with a matching name+path does NOT drop the test from default-feature
# runs — it is still discovered and run when its features are on.
#
# Two feature-gated tests are NOT listed here because each already carries a
# file-level `#![cfg(all(feature = "synth", feature = "pure-analysis"))]` guard
# (tests/ab_harness_s31.rs, tests/render_cli_determinism_s55.rs) — they compile
# to an empty binary under --no-default-features on their own.
#
# `pure-analysis` pulls the `image` crate and gates `audiohax::pure_analysis`;
# `synth` gates `audiohax::synth_sink` and pulls `rustysynth`/`cpal`.

# Import `audiohax::pure_analysis` (and/or the `image` crate) → need `pure-analysis`.
[[test]]
name = "prominence_s43"
path = "tests/prominence_s43.rs"
required-features = ["pure-analysis"]

[[test]]
name = "qg_s53_review"
path = "tests/qg_s53_review.rs"
required-features = ["pure-analysis"]

[[test]]
name = "rhythm_variety_s50"
path = "tests/rhythm_variety_s50.rs"
required-features = ["pure-analysis"]

[[test]]
name = "runtime_reachability_s37"
path = "tests/runtime_reachability_s37.rs"
required-features = ["pure-analysis"]

[[test]]
name = "s52_probe_identity"
path = "tests/s52_probe_identity.rs"
required-features = ["pure-analysis"]

[[test]]
name = "saliency_s18"
path = "tests/saliency_s18.rs"
required-features = ["pure-analysis"]

[[test]]
name = "variety_scorecard_s45"
path = "tests/variety_scorecard_s45.rs"
required-features = ["pure-analysis"]

# Also imports `audiohax::synth_sink` / `rustysynth` → need `pure-analysis` AND `synth`.
[[test]]
name = "phase2_pure_pipeline"
path = "tests/phase2_pure_pipeline.rs"
required-features = ["pure-analysis", "synth"]

[features]
# ── WS-4 Phase 2 (S11) Lane C — DEFAULT flipped to PURE RUST (design §5.1). ──
# A clean Linux/Windows box runs `cargo build`/`cargo run` and gets audible output
# with NO system OpenCV, NO libclang, NO external FluidSynth, NO virtual MIDI port.
# (On Linux, cpal's ALSA backend still needs `libasound2-dev` to build — the one
# surviving, ubiquitous Linux build prereq; design §6.4. Windows/macOS: dep-free.)
# WS-4 S12: `midi-out` PROMOTED into default so the shipped binary offers
# `--output midi` with no rebuild (runtime sink selection needs BOTH sinks
# compiled in). midir's Linux ALSA backend reuses cpal's `libasound2-dev`
# prereq — no NEW system dep; Windows/macOS need nothing extra. (design-s12 §2.1a)
default = ["pure-analysis", "synth", "midi-out"]

# ── WS-4 Phase 2 (S11) Lane A — pure-Rust image-feature analyzer (src/pure_analysis.rs).
# Pulls `image` + `imageproc` (both pure Rust; build headless with OpenCV off via
# `--no-default-features --features pure-analysis`).
pure-analysis = ["image", "dep:imageproc"]

# ── WS-4 Phase 2 (S11) Lane B — in-process pure-Rust SoundFont synth sink
# (src/synth_sink.rs). Pulls `rustysynth` (SF2 synthesis) + `cpal` (cross-platform
# audio output) + `rtrb` (the lock-free SPSC engine→audio bridge). All pure Rust.
synth = ["dep:rustysynth", "dep:cpal", "dep:rtrb"]

# ── OPT-IN legacy/high-fidelity path: OpenCV image analysis + camera + highgui
# window + overlay PNGs (the A/B reference + the operator's escape hatch).
# Reintroduces libclang/system-OpenCV. Pulls `image` too (shared with pure-analysis).
opencv = ["dep:opencv", "image"]

# ── OPT-IN: route NoteEvents to an EXTERNAL MIDI port / DAW / FluidSynth instead of
# the bundled synth (the exact-FluidSynth-parity reference, and "use my own synth").
midi-out = ["dep:midir"]

# ── S123: the desktop window (`audiohax-gui`, src/gui/). NOT in `default`. Pulls eframe/egui
# (glow renderer only, no wgpu) and `rfd` (native file dialogs). Every GUI-side bound on
# untrusted input lives in src/gui/ (security review s123-SH, lead ruling L-9).
gui = ["dep:eframe", "dep:rfd", "pure-analysis", "synth", "midi-out"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── WS-4 Phase 1 (S9) — CLI + config, all pure-Rust (build --no-default-features) ──
clap = { version = "4", features = ["derive"] }   # unified CLI parser (cli.rs)
toml = "0.8"                                        # parse audiohax.toml config file
directories = "5"                                  # platform config dir for the config file
midir = { version = "0.8", optional = true }     # now opt-in via the `midi-out` feature (was default)
rand = "0.8"
opencv = { version = "0.95.1", optional = true } # now opt-in via the `opencv` feature (was default)
anyhow = "1.0"
# BUG-01: graceful SIGINT/Ctrl-C handling so the external-MIDI path can flush an
# all-sound-off on shutdown (pure-Rust, cross-platform: Linux/Windows/macOS — matches
# the project's OS-agnostic posture). Regular (non-optional) dep: the handler is wired
# in main.rs regardless of which output sink is selected. The "termination" feature
# routes SIGTERM (kill) and SIGHUP (terminal-window-close) through the same handler as
# SIGINT (Ctrl-C), so all catchable quit paths flush the MIDI panic (BUG-01).
ctrlc = { version = "3.4", features = ["termination"] }

# ── WS-4 Phase 2 (S11) Lane B deps — in-process synth sink (pure Rust; gated by `synth`) ──
# rustysynth: pure-Rust SoundFont (SF2) synthesizer, MIT-licensed, std-only. API used:
#   SoundFont::new(&mut impl Read) / SynthesizerSettings::new(sample_rate)
#   Synthesizer::new(&Arc<SoundFont>, &SynthesizerSettings)
#   process_midi_message(channel:i32, command:i32, data1:i32, data2:i32)
#   render(&mut [f32] left, &mut [f32] right) / get_block_size() (verified against the resolved 1.3.x).
rustysynth = { version = "1.3", optional = true }
# cpal: cross-platform audio output (ALSA/PulseAudio on Linux, WASAPI on Windows,
# CoreAudio on macOS). Resolved to the latest compatible (design said 0.15 [VERIFY];
# 0.16+ is current and the API we use — default_host/default_output_device/
# build_output_stream — is stable across it).
cpal = { version = "0.16", optional = true }
# rtrb: realtime-safe lock-free SPSC ring buffer — the engine→audio-thread MidiCmd
# bridge. AudioSink methods push (non-blocking, allocation-free); the audio callback pops.
rtrb = { version = "0.3", optional = true }

# Modem / codec related deps
hound = "3.5.1"          # wav read/write
hex = "0.4"              # hex parsing helpers
flate2 = "1.0"           # gzip compression
crc32fast = "1.3"        # CRC32 checks
thiserror = "1.0"        # structured decode-path error types (ModemError)
aes-gcm = "0.10"         # AES-GCM encryption (optional)
rand_core = "0.6"        # for secure random nonce
rand_chacha = "0.3"      # seeded deterministic RNG for the acoustic-channel model (S7)
twoway = "0.2"
reed-solomon-erasure = "6"	# Reed-Solomon erasure coding (used for FEC)

image = { version = "0.24", optional = true }           # image loading/resizing and JPEG encoding

# ── WS-4 Phase 2 (S11) Lane A dep — pure-Rust CV ops (Canny/Otsu/connected-components). ──
# Version pin reconciliation (conflicts with design §5 "imageproc 0.25 [VERIFY]"): 0.25
# pulls `image 0.25`, a SECOND incompatible major of `image` alongside the project's
# `image 0.24` — they do not interop across the `image::Rgb<u8>` boundary. 0.23 is the
# version that depends on `image 0.24`, so Lane A pins 0.23. (Laplacian is hand-rolled in
# f64 in pure_analysis.rs since 0.23 lacks `filter::laplacian_filter` — closer to OpenCV's
# CV_64F path anyway. See module header.)
imageproc = { version = "0.23", optional = true }

# ── WS-4 Phase 3 (S10) — TUI front-end, pure-Rust (build --no-default-features) ──
# Both are pure-Rust (no system libs) and compile under --no-default-features; they
# are REGULAR (non-optional) deps so the headless `audiohax-tui` bin builds with the
# default feature set off. crossterm is ratatui's default backend; pinned explicitly.
ratatui = "0.29"                                   # terminal UI widgets (tui.rs render path)
crossterm = "0.28"                                 # terminal backend / event loop (audiohax-tui bin)

# ── S123 — desktop window deps (optional; only the `gui` feature pulls them) ──
# Pinned EXACTLY to releases at least 14 days old at adoption (security review s123-SH § 4.10):
# eframe/egui 0.36.2 (2026-09-08; 0.37.0 of 2026-10-15 is too new), rfd 0.17.2 (2026-01-12).
# Transitive crates are locked to releases at least 14 days old too (`cargo update --precise`).
# eframe: ONE renderer (glow), accesskit kept (screen-reader floor), default fonts, X11 and
# Wayland. NO egui_extras / image loaders (s123-SH D-2: they would decode untrusted bytes a
# second time with none of the caps). NOTE: eframe 0.36 itself depends on `image 0.25`
# (png only, for window icons) and its clipboard crate `arboard` uses it too, so a gui build
# carries both `image` majors; the window decodes picture bytes ONLY with this crate's 0.24.
eframe = { version = "=0.36.2", optional = true, default-features = false, features = ["glow", "accesskit", "default_fonts", "x11", "wayland"] }
# rfd: native Open/Save dialogs. Default backend on Linux is xdg-desktop-portal (pure Rust, no
# libgtk-3-dev at build time).
rfd = { version = "=0.17.2", optional = true }

[dev-dependencies]
rand_chacha = "0.3"

# ── Build-profile guidance for the modem decode path ─────────────────────────
# The chirp-sync decoder is Goertzel-heavy: per symbol window it runs a per-channel
# per-tone arg-max, and `recover_symbol_timing` sweeps a sub-sample stride grid whose
# per-window alignment metric is itself a per-channel per-tone Goertzel max. That inner
# Goertzel recurrence is a serial (data-dependent) FP chain, so it is latency-bound: an
# UNOPTIMIZED (`cargo build`, dev) `modem_decode` runs it roughly 2x slower than a
# release binary, and a large payload takes tens of seconds either way. Operators
# measuring or running the decoder should prefer `cargo build --release` /
# `cargo run --release` — that is the primary throughput lever. (opt-level never changes
# numeric behavior: Rust does not enable fast-math / FP reassociation at any level, so
# every byte-exact round-trip and freq-offset golden is identical across dev/release.)

# Explicit release settings (documents the throughput path; opt-level 3 is the default).
[profile.release]
opt-level = 3